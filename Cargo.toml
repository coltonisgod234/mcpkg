[package]
name = "mcpkg"
version = "0.0.4"
edition = "2024"

description = "an external, declarative tool to manage Minecraft Java Edition servers."
license = "GPL-3.0-or-later"
authors = ["Colton Wollinger <cwoll1home@gmail.com>"]
readme = "README.md"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.29"
rcon = { version = "0.6.0", features = ["rt-async-std"] }
reqwest = { version = "0.12.25", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v7"] }
walkdir = "2.5.0"
